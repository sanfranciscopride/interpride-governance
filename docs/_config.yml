title: "InterPride Governance"
description: "Canonical Digital Edition of InterPride's Bylaws, Standing Rules, Resolutions, GAC Rules, and Governance Committee Playbooks (2022–2026)"
theme: just-the-docs
remote_theme: just-the-docs/just-the-docs@v0.10.0
color_scheme: light

# Enable search
search_enabled: true
search:
  heading_level: 3
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s\-\/]+/

# Enable Mermaid diagrams
mermaid:
  version: "10.9.1"

# Navigation & Back-to-top
back_to_top: true
back_to_top_text: "Back to top"

# Callouts configuration (Just the Docs)
callouts_level: quiet
callouts:
  warning:
    title: "Governance Audit Errata"
    color: red
  important:
    title: "Governance Context & 2026 Update"
    color: blue
  note:
    title: "Historical & Editorial Note"
    color: purple

# Auxiliary links in upper right
aux_links:
  "Master Version Analysis":
    - "https://github.com"
  "InterPride.org":
    - "https://www.interpride.org/resources/"
aux_links_new_tab: true

footer_content: "Canonical Digital Edition prepared for the InterPride Governance Committee • Updated through October 2026 (`Bylaws 12.12.25` • `Standing Rules 04.06.26` • `Resolutions 03.20.26` • `GAC Rules 07.17.26`)."
